<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url("img.png") no-repeat;
            background-size: cover;
            background-position: center;
        }

        .wrapper {
            background-color: transparent;
            border: 2px solid rgba(255, 255, 255, .2);
            backdrop-filter: blur(20px);
            /*note*/
            box-shadow: 0 0 10px rgba(255, 255, 255, .2);
            /*note*/
            color: aliceblue;
            width: 420px;
            border-radius: 10px;
            padding: 30px 40px;
        }

        .wrapper h1 {
            font-size: 36px;
            text-align: center;
        }

        .wrapper .input-box {
            width: 100%;
            height: 50px;
            margin: 30px 0;
            position: relative;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, .2);
            border-radius: 40px;
            font-size: 16px;
            color: aliceblue;
            padding: 20px 45px 20px 20px;
            /*note*/
        }

        .input-box input::placeholder {
            color: aliceblue;
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            /*note*/
            font-size: 20px;
        }

        .wrapper .remember {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin: -15px 0 15px;
            /*note*/
        }

        .remember label input {
            accent-color: aliceblue;
            margin-right: 3px;
        }

        .remember a {
            color: aliceblue;
            text-decoration: none;
        }

        .remember a:hover {
            text-decoration: underline;
        }

        .wrapper .btn {
            width: 100%;
            height: 45px;
            background: aliceblue;
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(255, 255, 255, .1);
            /*note*/
            cursor: pointer;
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .wrapper .register {
            font-size: 14px;
            text-align: center;
            margin: 20px 0 15px;
        }

        .register p a {
            color: aliceblue;
            text-decoration: none;
            font-weight: 600;
        }

        .register p a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
                <i class="bx bx-lock"></i>
            </div>
            <div class="remember">
                <label><input type="checkbox">remember Me</label>
                <a href="">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register">
                <p>Don't have an account? <a href="">register</a></p>
            </div>
        </form>
    </div>
</body>

</html>
